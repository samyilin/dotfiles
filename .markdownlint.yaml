# markdownlint-cli rule overrides. Uses the default rule set otherwise.
MD013:
  line_length: 72        # matches vim/.vimrc textwidth=72
  code_blocks: false     # fenced/indented code can't be wrapped safely
  tables: false          # hand-maintained tables (e.g. docker-notes.md)
  headings: false
MD059: false  # descriptive link text — short links like [here] are fine
MD060: false  # table column style — table alignment is hand-maintained
